apiVersion: v1
kind: Namespace
metadata:
  name: microservices-demo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: microservices-demo
spec:
  # Keep one replica: multiple PostgreSQL Pods must not share one PGDATA directory.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # PostgreSQL official Debian image runs as UID/GID 999. The NFS
      # directory is pre-owned by 999 on the NFS server, so no fsGroup
      # ownership rewrite is needed on the NFS mount.
      initContainers:
        # Prepare the two Pod/worker-local demo mounts for the postgres user.
        - name: prepare-demo-directories
          image: busybox:1.36
          command: ["sh", "-c", "chmod 1777 /tmp"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-temp
              mountPath: /tmp
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopping-secret
                  key: POSTGRES_PASSWORD
            # Keep PostgreSQL's data files in a subdirectory of the mounted NFS export.
           # - name: PGDATA
            #  value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            # NFS: PostgreSQL database files. Prepare this directory on the NFS server
            # with owner 999:999 before starting the Deployment.
            - name: postgres-main
              mountPath: /var/lib/postgresql/data
            # emptyDir: temporary files; contents disappear when the Pod is removed.
            - name: postgres-temp
              mountPath: /tmp
            # hostPath: workshop backup files on the worker node hosting this Pod.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-temp
          emptyDir: {}
        - name: postgres-main
          hostPath:
            path: /var/lib/postgresql/data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: devpipeline/online-shop:frontend-v2
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: shopping-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: microservices-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
        - name: product-api
          image: devpipeline/online-shop:product-v2
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopping-secret
                  key: DATABASE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: product-api
  ports:
    - name: http
      port: 5001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: microservices-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: devpipeline/online-shop:order-v2
          ports:
            - name: http
              containerPort: 5002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopping-secret
                  key: DATABASE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shopping-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: order-api
  ports:
    - name: http
      port: 5002
      targetPort: http
