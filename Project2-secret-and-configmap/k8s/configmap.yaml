apiVersion: v1
kind: ConfigMap
metadata:
  name: shopping-config
  namespace: microservices-demo
data:
  APP_ENV: "workshop"
  LOG_LEVEL: "info"

  POSTGRES_DB: "shop"
  POSTGRES_USER: "shopuser"
  DB_HOST: "postgres"
  DB_PORT: "5432"

  PRODUCT_API_HOST: "product-service"
  ORDER_API_HOST: "order-service"

  NGINX_ENVSUBST_FILTER: "PRODUCT_API_HOST|ORDER_API_HOST"